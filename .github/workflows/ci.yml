name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: valkey/valkey:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://resilisense:resilisense@localhost:5432/resilisense_test
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Create non-superuser test role (RLS applies to it)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE resilisense LOGIN CREATEDB PASSWORD 'resilisense'"
          psql -h localhost -U postgres -c "CREATE DATABASE resilisense_test OWNER resilisense"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Spec user stories have tests (or a waiver in spec-coverage.json)
        run: npm run spec:coverage
      - name: Unit tests + engine coverage floor (vitest.config.mts)
        run: npm test -- --coverage
      - name: E2E (contract-checked) + coverage floors (vitest.config.e2e.mts)
        run: npm run test:e2e -- --coverage
      - run: npm run build
      - name: openapi.json is up to date
        run: npm run openapi:check
      - name: Dependency audit (production, high+)
        run: npm run audit

  secrets:
    # Scans the current tree (not history: legacy commits contain secrets that were rotated/purged
    # separately — see docs/revamp/00-current-state-review.md §2.3). No licence needed for the binary.
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
      - name: gitleaks (working tree)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks dir . --no-banner --redact
