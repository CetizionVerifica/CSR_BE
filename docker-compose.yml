# Local development services (laptops with Docker). Claude Code cloud sessions use
# scripts/dev-services.sh instead (no Docker daemon there).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  valkey:
    image: valkey/valkey:8
    ports: ['6379:6379']
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: resilisense
      MINIO_ROOT_PASSWORD: resilisense-dev
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
  clamav:
    image: clamav/clamav:stable
    ports: ['3310:3310']
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
  miniodata:
